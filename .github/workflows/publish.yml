name: Publish

# Publishes the package to npm when a version tag (e.g. v0.1.0) is pushed.
# Uses npm Trusted Publishing (OIDC) -- no NPM_TOKEN secret needed. One-time
# setup: on the moxie-docs package page on npmjs.com, add a Trusted Publisher
# for GitHub Actions with repository Jackalope-Dev/Moxie-Docs-MCP and workflow
# filename publish.yml.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing requires a recent npm CLI (>=11.5.1); the version
      # bundled with setup-node's Node 20 predates OIDC support.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # prepublishOnly runs typecheck + test + build before the package is packed.
      - run: npm publish --provenance --access public
